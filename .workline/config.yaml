roles:
  product-owner:
    settings:
      # Trial copy: a draft or a question waits 5 min, not 24 h, so the
      # line's lazy consensus is seen within one watch. Split on (workline
      # ADR-0064 step 6); effort feeds the size an issue is ready at.
      acts: {ask: {wait: 5m}, split: {mode: act}, effort: {mode: act}}
  tester:
    settings:
      # Gradle's JVM unit tests, one JUnit report a test class, in each
      # module's build folder. Kotlin's and Gradle's build errors are the
      # role's own rows (build-errors), file:// paths read from the root.
      test-command: ./gradlew --console=plain testDebugUnitTest
      test-report: "**/build/test-results/testDebugUnitTest/*.xml"
      # {packages}: the modules a change touches (./core/timelapse), turned
      # into their tasks (:core:timelapse:testDebugUnitTest); a file of the
      # root build, or outside any module, runs the whole suite.
      module-files: [build.gradle.kts]
      draft-command: './gradlew --console=plain $(echo {packages} | sed -E ''s#\./##g; s#/#:#g; s#([^ ]+)#:\1:testDebugUnitTest#g'')'
      test-paths: ["**/src/test/**"]
  developer:
    settings:
      # Its proof on the modules its code and the tests touch; the pull
      # request's CI builds, tests and lints every module.
      proof-command: './gradlew --console=plain $(echo {packages} | sed -E ''s#\./##g; s#/#:#g; s#([^ ]+)#:\1:testDebugUnitTest#g'')'

routing:
  # Trial copy: every open issue's step in one reconcile.
  reconcile-max: 12
  # On a pull request, the committer and the documentalist, the tester's
  # guard on its own branches, then the reviewer reads the code. The line
  # of states (workline ADR-0059), by events (workline-develop.yml): an
  # issue to refine wakes the product owner, then the reviewer reads its
  # spec; one waiting for its tests wakes the tester; ready wakes the
  # developer.
  events: {pre-push: [committer, documentalist], merge-request: [committer, documentalist, tester, reviewer],
    schedule: [documentalist, product-owner, reviewer], issue: [product-owner, reviewer, tester, developer]}

# The forge merges what a person accepted (workline ADR-0042), and at
# `normal` a reproduced bug's fix once every check is green (ADR-0060).
merge: {autonomy: normal}
